name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 python3-venv
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python -m unittest discover -v
